name: CI / GitHub + Lovable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate server file
        run: node -c server.js

      - name: Run optional tests
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test;
          else
            echo 'No test script configured';
          fi

  deploy:
    name: Deploy to Lovable
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy notice
        run: |
          echo "This repository is ready to deploy to Lovable."
          echo "Connect github.com/chakraa1/ingredient-scanner to Lovable and configure secrets there."
